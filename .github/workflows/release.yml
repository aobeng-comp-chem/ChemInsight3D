# Build the standalone Linux and Windows bundles and publish them as a GitHub release.
#
# Release:    git tag v1.0.0 && git push origin v1.0.0
#             Both bundles are built, self-checked, and attached to the release for that tag.
# Test build: Actions tab -> "Release bundles" -> Run workflow.
#             The bundles are built and kept as workflow artifacts; no release is made.

name: Release bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux bundle
    # Built on an older Ubuntu so the bundle also runs on older distributions (glibc 2.35+).
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # System libraries Qt and VTK load at import time; PyInstaller leaves them out
      # of the bundle, so --self-check needs them on the build machine.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxrender1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: Build bundle
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./build_bundle.sh

      - name: Create archive
        run: tar czf ChemInsight3D-linux-x86_64.tar.gz -C build_dist ChemInsight3D

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ChemInsight3D-linux-x86_64.tar.gz
          retention-days: 7
          compression-level: 0   # already compressed

  windows:
    name: Windows bundle
    runs-on: windows-latest   # has the Visual Studio Build Tools with C++
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bundle
        shell: powershell
        run: >
          .\build_bundle.ps1 -Zip
          -Python "${{ steps.python.outputs.python-path }}"
          -WorkDir "$env:RUNNER_TEMP\ChemInsight3D-build"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ runner.temp }}/ChemInsight3D-build/ChemInsight3D-windows.zip
          retention-days: 7
          compression-level: 0   # already compressed

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      # Creates the release, or adds the files to it if it already exists
      # (e.g. when the workflow is re-run for the same tag).
      - name: Create release and upload bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "ChemInsight3D $TAG" --generate-notes --verify-tag
          gh release upload "$TAG" --clobber \
            bundles/ChemInsight3D-linux-x86_64.tar.gz \
            bundles/ChemInsight3D-windows.zip
